# ~/.config/keyd/app.conf — per-application keyd bindings, applied by
# keyd-application-mapper while a window of that class has focus (the tweak
# keyd-application-mapper.sh links this file there and runs the mapper as a user
# service). Each section's bindings are layered over /etc/keyd/default.conf and
# dropped when focus moves to another window. The class is the window's app id,
# lowercased with anything but letters and digits turned into '-': Alacritty
# becomes alacritty. Find one with `keyd-application-mapper -v`.

# Cmd+C copies in Alacritty. Everywhere else keyd sends Cmd+C as Ctrl+C, which
# is copy in a GUI app but SIGINT in a terminal. mac is the layer Cmd holds in
# default.conf; Ctrl+Shift+C is Alacritty's default Copy binding. Physical Ctrl+C
# is a different layer (control), so it stays Ctrl+C and interrupts as usual.
[alacritty]
mac.c = C-S-c
