# Flags /opt/vivaldi/vivaldi passes to Vivaldi, one per line. The wrapper skips
# lines that start with #, so keep comments on lines of their own.

# Load the CSS in ~/.config/vivaldi-css (vivaldi://flags/#vivaldi-css-mods).
# The vivaldi-css tweak points Vivaldi at that folder.
--enable-features=VivaldiCssMods
