# ┃                     Defaults Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

$filemanager = nemo
$terminal = alacritty
$screenshot-fullscreen = grim - | swappy -f -
$screenshot-selection = grim -g "$(slurp)" - | swappy -f -
$clipboard = vicinae 'vicinae://launch/clipboard/history?toggle=true'
$powermenu = vicinae 'vicinae://launch/power?toggle=true'
$applauncher = vicinae toggle
$keepassxc = vicinae 'vicinae://launch/@system7/store.vicinae.keepassxc/search?toggle=true'
$bitwarden = vicinae 'vicinae://launch/@bl4zee1g/store.vicinae.bitwarden/browse-vault?toggle=true'
$tailscale = vicinae 'vicinae://launch/@samlinville/store.raycast.tailscale?toggle=true'
$emoji = vicinae 'vicinae://launch/core/search-emojis?toggle=true'
