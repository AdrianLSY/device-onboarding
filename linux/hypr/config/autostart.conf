# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Autostart Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/config/defaults.conf

# Autostart wiki https://wiki.hyprland.org/0.45.0/Configuring/Keywords/#executing #

exec-once = swaybg -o \* -i ~/.config/hypr/wallpaper/Brisbane_cityscape_6000x4000.jpeg -m fill
exec-once = waybar &
exec-once = fcitx5 -d &
exec-once = mako &
exec-once = nm-applet --indicator &
exec-once = bash -c "mkfifo /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob && tail -f /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob | wob & disown" &
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &

# ## Slow app launch fix
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP &
exec-once = hash dbus-update-activation-environment 2>/dev/null &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP &

# ## Idle configuration
exec-once = $idlehandler

# ## Wallpaper (using swaybg, configured above)

# ## Dark mode by default
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"

# ## Start the clipboard manager
exec-once = ~/.config/rofi/clipboard/clipboard-daemon.sh &

# ## Unmute USB DAC on startup
exec-once = sleep 1 && ~/.config/hypr/scripts/unmute-dac &
exec-once = sleep 1 && noisetorch -i &

# ## Start Apps (workspace assignment handled by window rules)
exec-once = steam &
exec-once = keepassxc &
exec-once = bitwarden-desktop &
exec-once = claude-desktop &
exec-once = chatgpt &
exec-once = nm-applet &
exec-once = tableplus &
exec-once = blueman-applet &
exec-once = org.cryptomator.Cryptomator &
exec-once = flatpak run com.spotify.Client &
exec-once = flatpak run com.ultimaker.cura &
exec-once = flatpak run md.obsidian.Obsidian &
exec-once = flatpak run dev.deedles.Trayscale &
exec-once = flatpak run com.getpostman.Postman &
exec-once = flatpak run org.mozilla.thunderbird &
exec-once = flatpak run com.bambulab.BambuStudio &
exec-once = flatpak run com.dropbox.Client start &
exec-once = flatpak run org.localsend.localsend_app &
exec-once = /opt/vivaldi/vivaldi --profile-directory=Default --app-id=magkoliahgffibhgfkmoealggombgknl &
