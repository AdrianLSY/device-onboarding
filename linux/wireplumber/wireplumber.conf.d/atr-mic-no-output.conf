# The Audio-Technica ATR USB mic also exposes a headphone-monitor output.
# It ties the Topping DX5 II on session priority (1109), so WirePlumber
# kept picking it as the default speaker. Disable that output node; the
# mic's input is untouched.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.usb-Audio-Technica_ATR_USB_microphone-00.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
