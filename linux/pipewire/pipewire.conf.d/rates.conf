# Let the graph switch to the stream's own rate instead of resampling
# everything to 48 kHz. The list is every rate the Topping DX5 II accepts
# (/proc/asound/card*/stream0). PipeWire switches only while the DAC is idle
# or one stream plays; with mixed rates it falls back to resampling.
context.properties = {
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 352800 384000 705600 768000 ]
}
