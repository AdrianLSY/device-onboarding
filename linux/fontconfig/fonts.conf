<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Inter (pacman/inter-font.sh) is the default sans-serif, as in Waybar and SwayNC. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>
</fontconfig>
