# Carried over from kitty. kitty.conf itself set only the close prompt and the
# two keys under [keyboard]; everything else kitty drew came from its built-in
# defaults, which are pinned here so the terminal looks as it did.
# kitty's confirm_os_window_close 0 needs no line: Alacritty never asks before
# closing.

[window]
# Blank space between the window edge and the text, on all four sides. 12 px
# matches the window rounding in hypr/config/decorations.conf, so the text
# clears the rounded corners. The macOS terminal (ghostty) uses 1 px, which
# looks cramped here.
padding = { x = 12, y = 12 }
# A bit glassy, like a macOS window: Hyprland blurs what shows through
# (decoration:blur in hypr/config/decorations.conf).
opacity = 0.80
# kitty's placement_strategy center: spread the spare pixels round the grid,
# on top of the padding above
dynamic_padding = true

[font]
size = 11.0
# kitty draws this font in 20 px rows, Alacritty in 21
offset = { x = 0, y = -1 }

[cursor]
# kitty's shell integration shows a 2 px beam at the fish prompt; Alacritty
# can't switch shape per prompt, so the beam is the default (nvim sets its own).
# kitty blinks every 500 ms on Linux and stops after 15 s without input.
style = { shape = "Beam", blinking = "On" }
thickness = 0.22
blink_interval = 500
blink_timeout = 15

[mouse]
# kitty hides the pointer after 3 s idle; Alacritty can only hide it on typing
hide_when_typing = true

[colors.primary]
foreground = "#dddddd"
background = "#000000"

[colors.cursor]
text = "#111111"
cursor = "#cccccc"

[colors.selection]
text = "#000000"
background = "#fffacd"

[colors.normal]
black = "#000000"
red = "#cc0403"
green = "#19cb00"
yellow = "#cecb00"
blue = "#0d73cc"
magenta = "#cb1ed1"
cyan = "#0dcdcd"
white = "#dddddd"

[colors.bright]
black = "#767676"
red = "#f2201f"
green = "#23fd00"
yellow = "#fffd00"
blue = "#1a8fff"
magenta = "#fd28ff"
cyan = "#14ffff"
white = "#ffffff"

# Mac-style Cmd+V and Cmd+C. keyd sends Cmd+key as Ctrl+key and physical Ctrl+V
# as Super+V, so Cmd+V arrives as Ctrl+V, bound below. Cmd+C would arrive as
# Ctrl+C, SIGINT here, so keyd's per-app mapper (keyd/app.conf, set up by the
# keyd-application-mapper tweak) sends it to Alacritty as Ctrl+Shift+C, an
# Alacritty default for Copy. Physical Ctrl+C stays SIGINT. kitty's Ctrl+C
# copy_or_interrupt has no Alacritty form: a binding can't depend on whether text
# is selected.
[keyboard]
bindings = [
    { key = "V", mods = "Control", action = "Paste" },
]
