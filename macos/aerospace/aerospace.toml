# See: https://adrianlsy.github.io/AeroSpace/commands#exec-and-forget
alt-space = '''exec-and-forget osascript -e '
if application "Ghostty" is running then
    tell application "System Events" to tell process "Ghostty" to click menu item "New Window" of menu "File" of menu bar 1
else
    tell application "Ghostty" to activate
end if'
'''
ctrl-space = '''exec-and-forget osascript -e '
tell application "Finder"
    make new Finder window to POSIX file (POSIX path of (path to home folder))
    activate
end tell'
'''

# See: https://adrianlsy.github.io/AeroSpace/commands#mode
ctrl-alt-space = 'mode service'

# 'service' binding mode declaration.
# See: https://adrianlsy.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = [
    'layout floating tiling',
    'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

ctrl-alt-left = ['join-with left', 'mode main']
ctrl-alt-down = ['join-with down', 'mode main']
ctrl-alt-up = ['join-with up', 'mode main']
ctrl-alt-right = ['join-with right', 'mode main']

down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']
